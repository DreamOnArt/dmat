const baseLayer=L.layerGroup().addTo(map);

},{collapsed:false}).addTo(map);

const bounds=L.latLngBounds();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function distanceKm(lat1,lon1,lat2,lon2){
  const R=6371;
  const rad=x=>x*Math.PI/180;
  const dLat=rad(lat2-lat1), dLon=rad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+
    Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function popupHtml(f){
  const d=distanceKm(EPICENTER.lat,EPICENTER.lon,f.lat,f.lon);
  return `<div class="popup-title">${f.disasterBase?"【災害拠点病院】<br>":""}${esc(f.name)}</div>
  <div class="popup-distance">震源から ${d.toFixed(1)} km</div>
  <b>被害区分：</b>${esc(f.status)}<br>
  <b>支援要否：</b>${esc(f.support||"-")}<br>
  <b>医療派遣：</b>${esc(f.dispatch||"-")}<br>
  <b>震度：</b>${esc(f.intensity||"-")}<br>
  <b>アクセス：</b>${esc(f.access||"-")}<br>
  <b>大方針：</b>${esc(f.policy||"-")}<br>
  <b>支援状況：</b>${esc(f.support_status||"-")}<br>
  <b>必要な支援：</b>${esc(f.need||"-")}<hr>
  <b>住所：</b>${esc(f.address)}<br>
  <b>座標：</b>${f.lat.toFixed(6)}, ${f.lon.toFixed(6)}`;
}

function addEpicenter(){
  const icon=L.divIcon({
    className:"",
    html:'<div style="font-size:35px;color:#7a0010;text-shadow:0 0 2px #fff,0 0 5px #fff;transform:translate(-8px,-14px)">★</div>',
    iconSize:[36,36],
    iconAnchor:[18,18]
  });
  L.marker([EPICENTER.lat,EPICENTER.lon],{icon}).addTo(epicenterLayer)
    .bindPopup("<b>2026年7月28日 16:27</b><br>震源：熊本県熊本地方<br>北緯32.6度・東経130.7度<br>M7.1・深さ約10km・最大震度7");
  bounds.extend([EPICENTER.lat,EPICENTER.lon]);
}

function addFacility(f){
  const layer=f.disasterBase?baseLayer:generalLayer;

  if(f.disasterBase){
    L.circleMarker([f.lat,f.lon],{
      radius:12,
      color:"#0057b8",
      weight:4,
      fillColor:"#fff",
      fillOpacity:.75
    }).addTo(layer);
  }

  const marker=L.circleMarker([f.lat,f.lon],{
    radius:f.disasterBase?8:6,
    color:f.disasterBase?"#001f5b":"#111",
    weight:f.disasterBase?2.5:1,
    fillColor:f.color,
    fillOpacity:.95
  }).addTo(layer);

  marker.bindTooltip((f.disasterBase?"【災害拠点】":"")+f.name,{sticky:true});
  marker.bindPopup(popupHtml(f),{maxWidth:390});
  bounds.extend([f.lat,f.lon]);
}

addEpicenter();
facilities.forEach(addFacility);
if(bounds.isValid()) map.fitBounds(bounds.pad(.05));

document.getElementById("fit").addEventListener("click",()=>{
  if(bounds.isValid()) map.fitBounds(bounds.pad(.05));
});
document.getElementById("near").addEventListener("click",()=>{
  map.setView([EPICENTER.lat,EPICENTER.lon],11);
});

const statusPanel=document.getElementById("statusPanel");
const statusToggle=document.getElementById("statusToggle");
const panelClose=document.getElementById("panelClose");

function setPanel(open){
  statusPanel.classList.toggle("open",open);
  statusToggle.setAttribute("aria-expanded",String(open));
  statusToggle.textContent=open?"状況を隠す":"状況を表示";
  setTimeout(()=>map.invalidateSize(),50);
}
statusToggle.addEventListener("click",()=>setPanel(!statusPanel.classList.contains("open")));
panelClose.addEventListener("click",()=>setPanel(false));
document.addEventListener("keydown",e=>{if(e.key==="Escape")setPanel(false);});

</script>
